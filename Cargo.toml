[package]
name = "eudi-access"
version = "0.1.0"
edition = "2021"

[dependencies]
isomdl = { git = "https://github.com/Slixh/isomdl", branch = "main" }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
async-trait = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
futures = "0.3.32"
tokio-stream = { version = "0.1", features = ["sync"] }
qrcode = "0.14"
base64 = "0.22"
pcsc = "2.9.0"
wry = "0.57"
tao = "0.37"

# Linux-only hardware crates. They won't build on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd", "l2cap"] }
rppal = "0.22"
